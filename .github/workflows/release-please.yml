name: Release

on:
  push:
    branches:
      - main
  # By hand, from the Actions tab ("Run workflow", on the branch main):
  # - image: publishes the image of an existing version again, without a new
  #   release;
  # - release-pr: runs the release step itself, for the day a merge into main
  #   did not start this workflow and the release pull request never appeared
  #   (or was merged without its version being published).
  workflow_dispatch:
    inputs:
      mode:
        description: "image: publish the image of a version again - release-pr: open or update the release pull request"
        type: choice
        options:
          - image
          - release-pr
        default: image
      version:
        description: For "image" only - version to publish, as tagged (for example 2.9.0)
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    if: github.event_name == 'push' || inputs.mode == 'release-pr'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The release is computed from main, whatever branch was picked by hand.
      - name: Check the branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow on the branch main (it was run on $GITHUB_REF_NAME)."
          exit 1

      - name: Open or update the release pull request
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The image is what a server runs: it is published with each version.
  image:
    name: Publish the container image
    needs: release-please
    if: >-
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode != 'release-pr') ||
      needs.release-please.outputs.release_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/skycrew-app/frontend
      VERSION: ${{ (inputs.mode != 'release-pr' && inputs.version) || needs.release-please.outputs.tag_name }}
    steps:
      - name: Check that a version was given
        run: |
          if [ -z "$VERSION" ]; then
            echo "::error::No version to publish: fill in \"version\" (for example 2.9.0) when running the mode \"image\"."
            exit 1
          fi

      - name: Check out the released version
        uses: actions/checkout@v4
        with:
          ref: ${{ env.VERSION }}

      - name: Sign in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin

      - name: Build the image
        env:
          SOURCE: https://github.com/${{ github.repository }}
          # Public keys read by the browser, set as repository variables.
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_PAYPAL_CLIENT_ID: ${{ vars.NEXT_PUBLIC_PAYPAL_CLIENT_ID }}
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY \
            --build-arg NEXT_PUBLIC_PAYPAL_CLIENT_ID \
            --label "org.opencontainers.image.source=$SOURCE" \
            --label "org.opencontainers.image.version=$VERSION" \
            -t "$IMAGE:$VERSION" -t "$IMAGE:latest" .

      # Not published if it does not hold what it must (content and start-up).
      # Versions older than this check are published as before.
      - name: Check the image
        run: |
          if [ -f .github/scripts/image-smoke.sh ]; then
            sh .github/scripts/image-smoke.sh "$IMAGE:$VERSION"
          else
            echo "::notice::This version has no image check: published without it."
          fi

      - name: Publish the image
        run: docker push --all-tags "$IMAGE"
